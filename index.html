<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tegevusteraapia Keskus — 4 kujundus- ja abileidja suunda</title>
  <script>
    (function () {
      var p = window.location.pathname;
      if (p && !p.endsWith('/') && !p.endsWith('.html')) {
        window.location.replace(p + '/' + window.location.search + window.location.hash);
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F5F2EC; color: #24211E; }
    body { display: flex; flex-direction: column; }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 18px;
      background: #FFFDF9;
      border-bottom: 1px solid #DDD6C8;
      flex-wrap: wrap;
    }
    .brand { font-size: 13px; font-weight: 600; color: #24211E; }
    .brand span { font-weight: 400; color: #665E55; margin-left: 8px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab {
      appearance: none;
      border: 1px solid #D4CCBD;
      background: #F7F4EE;
      color: #2C2824;
      padding: 6px 12px;
      border-radius: 2px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }
    .tab:hover { border-color: #8C8275; background: #EFEAE0; }
    .tab.active { background: #24211E; color: #FFFDF9; border-color: #24211E; }
    .open-link { font-size: 12.5px; color: #24211E; text-decoration: underline; }
    iframe { flex: 1; width: 100%; border: 0; background: #F6F1E8; }
  </style>
</head>
<body>
  <header class="bar">
    <div class="brand">tegevusteraapiakeskus.ee <span>4 kujundust, 4 fondi- ja värvisuunda, 4 erinevat abileidjat</span></div>
    <nav class="tabs" aria-label="Vali kujundussuund">
      <button class="tab active" type="button" data-slug="v2-pohjala">1 · Põhjala (reaalajas abileidja)</button>
      <button class="tab" type="button" data-slug="v1-kasikiri">2 · Käsikiri (trükifolio 1/3)</button>
      <button class="tab" type="button" data-slug="v3-paevavalgus">3 · Päevavalgus (eakasõbralik suur)</button>
      <button class="tab" type="button" data-slug="v4-eesti-puhas">4 · Eesti Puhas (lause-abileidja)</button>
    </nav>
    <a id="direct" class="open-link" href="./v2-pohjala/index.html" target="_blank" rel="noopener">Ava eraldi aknas</a>
  </header>
  <iframe id="stage" src="./v2-pohjala/index.html" title="Kujundussuund"></iframe>
  <script>
    const slugs = ['v2-pohjala', 'v1-kasikiri', 'v3-paevavalgus', 'v4-eesti-puhas'];
    const stage = document.getElementById('stage');
    const direct = document.getElementById('direct');
    const tabs = Array.from(document.querySelectorAll('.tab'));
    function pick(slug) {
      if (!slugs.includes(slug)) slug = 'v2-pohjala';
      stage.src = './' + slug + '/index.html';
      direct.href = './' + slug + '/index.html';
      tabs.forEach(t => t.classList.toggle('active', t.dataset.slug === slug));
      try { history.replaceState(null, '', '#' + slug); } catch {}
    }
    tabs.forEach(t => t.addEventListener('click', () => pick(t.dataset.slug)));
    const h = location.hash.replace('#', '');
    if (slugs.includes(h)) pick(h);
  </script>
</body>
</html>
