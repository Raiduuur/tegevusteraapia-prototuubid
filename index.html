    (function () {
      var p = window.location.pathname;
      if (p && !p.endsWith('/') && !p.endsWith('.html')) {
        window.location.replace(p + '/' + window.location.search + window.location.hash);
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column;
      font: 500 13px/1.3 "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #E6E2DA; color: #ECEAE5;
      -webkit-font-smoothing: antialiased;
    }
    .bar { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; min-height: 48px; padding: 6px 14px; background: #202328; }
    .name { display: flex; align-items: baseline; gap: 8px; margin-right: auto; white-space: nowrap; }
    .name strong { font-weight: 600; font-size: 13.5px; letter-spacing: -0.01em; color: #FFFFFF; }
    .group { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(255, 255, 255, 0.08); flex-wrap: nowrap; }
    .group button {
      appearance: none; border: 0; background: transparent; color: #CFD4DC;
      min-height: 30px; padding: 4px 10px; border-radius: 7px; font: inherit; cursor: pointer; white-space: nowrap;
      transition: background-color 140ms ease, color 140ms ease;
    }
    .group button:hover { color: #FFFFFF; background: rgba(255, 255, 255, 0.08); }
    .group button[aria-selected="true"], .group button[aria-pressed="true"] { background: #F5F2EC; color: #1F1E1C; font-weight: 600; }
    .f-source { font-family: "Source Sans 3", sans-serif; }
    .f-rubik { font-family: "Rubik", sans-serif; }
    .f-lexend { font-family: "Lexend", sans-serif; font-size: 12.2px; }
    .f-literata { font-family: "Literata", Georgia, serif; }
    .f-fraunces { font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100; }
    .f-bitter { font-family: "Bitter", Georgia, serif; }
    .open-link { color: #ECEAE5; text-decoration: underline; text-decoration-color: rgba(236, 234, 229, 0.42); text-underline-offset: 3px; padding: 4px 2px; white-space: nowrap; }
    .open-link:hover { text-decoration-color: currentColor; }
    :focus-visible { outline: 2px solid #9CC0E2; outline-offset: 2px; }
    .stage { flex: 1; min-height: 0; display: flex; justify-content: center; }
    iframe { flex: 1; width: 100%; height: 100%; border: 0; background: #F5F2EC; }
    .stage[data-device="phone"] { padding: 20px 12px; overflow: auto; }
    .stage[data-device="phone"] iframe {
      flex: 0 0 auto; width: 390px; max-width: 100%; height: 844px; max-height: 100%;
      border: 1px solid rgba(31, 30, 28, 0.18); border-radius: 28px;
      box-shadow: 0 12px 32px rgba(31, 30, 28, 0.10);
    }
    @media (max-width: 1220px) {
      .name { display: none; }
    }
    @media (max-width: 900px) {
      .devices, .open-link { display: none; }
      .bar { flex-wrap: nowrap; gap: 8px; padding-inline: 10px; overflow-x: auto; scrollbar-width: none; }
      .group { flex: 0 0 auto; }
      .stage[data-device="phone"] { padding: 0; }
      .stage[data-device="phone"] iframe { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <p class="name"><strong>Tegevusteraapia Keskus</strong></p>
    <div class="group" role="tablist" aria-label="Kastid ja paigutus">
      <button type="button" role="tab" data-style="a" aria-selected="true">A · Paber</button>
      <button type="button" role="tab" data-style="b" aria-selected="false" tabindex="-1">B · Raam</button>
      <button type="button" role="tab" data-style="c" aria-selected="false" tabindex="-1">C · Pehme</button>
      <button type="button" role="tab" data-style="d" aria-selected="false" tabindex="-1">D · Keskus</button>
    </div>
    <div class="group" role="group" aria-label="Värvipalett">
      <button type="button" data-tone="sinine" aria-pressed="true">Sinine</button>
      <button type="button" data-tone="savi" aria-pressed="false">Savi</button>
      <button type="button" data-tone="kivi" aria-pressed="false">Kivi</button>
      <button type="button" data-tone="ploom" aria-pressed="false">Ploom</button>
    </div>
    <div class="group" role="group" aria-label="Font">
      <button type="button" class="f-source" data-font="source" aria-pressed="true" title="Source Sans 3 — puhas humanistlik sans">Source</button>
      <button type="button" class="f-rubik" data-font="rubik" aria-pressed="false" title="Rubik — pehme ümarate nurkadega sans">Rubik</button>
      <button type="button" class="f-lexend" data-font="lexend" aria-pressed="false" title="Lexend — lai ja õhuline kergesti loetav sans">Lexend</button>
      <button type="button" class="f-literata" data-font="literata" aria-pressed="false" title="Literata + Source Sans 3 — soe raamatulik serif">Literata</button>
      <button type="button" class="f-fraunces" data-font="fraunces" aria-pressed="false" title="Fraunces (Soft) + Source Sans 3 — pehme orgaaniline serif">Fraunces</button>
      <button type="button" class="f-bitter" data-font="bitter" aria-pressed="false" title="Bitter + IBM Plex Sans — kindel plaat-serif">Bitter</button>
    </div>
    <div class="group devices" role="group" aria-label="Vaate laius">
      <button type="button" data-device="desktop" aria-pressed="true">Arvuti</button>
      <button type="button" data-device="phone" aria-pressed="false">Telefon</button>
    </div>
    <a id="direct" class="open-link" href="./v5-rahulik/index.html?v=20261126-f2&amp;style=a&amp;tone=sinine&amp;font=source" target="_blank" rel="noopener">Ava eraldi</a>
  </header>
  <main class="stage" id="stage-wrap" data-device="desktop">
    <iframe id="stage" src="./v5-rahulik/index.html?v=20261126-f2&amp;style=a&amp;tone=sinine&amp;font=source" title="Tegevusteraapia Keskuse prototüüp"></iframe>
  </main>
  <script>
    const REV = '20261126-f2';
    const styles = ['a', 'b', 'c', 'd'];
    const tones = ['sinine', 'savi', 'kivi', 'ploom'];
    const fonts = ['source', 'rubik', 'lexend', 'literata', 'fraunces', 'bitter'];
    const stage = document.getElementById('stage');
    const wrap = document.getElementById('stage-wrap');
    const direct = document.getElementById('direct');
    const styleTabs = Array.from(document.querySelectorAll('[role="tab"][data-style]'));
    const toneBtns = Array.from(document.querySelectorAll('[data-tone][aria-pressed]'));
    const fontBtns = Array.from(document.querySelectorAll('[data-font][aria-pressed]'));
    const deviceBtns = Array.from(document.querySelectorAll('[data-device][aria-pressed]'));
    let current = { style: 'a', tone: 'sinine', font: 'source', device: 'desktop' };

    function pushTheme() {
      try {
        const doc = stage.contentDocument;
        if (doc && doc.documentElement) {
          doc.documentElement.dataset.style = current.style;
          doc.documentElement.dataset.tone = current.tone;
          doc.documentElement.dataset.font = current.font;
        }
      } catch {}
      try {
        stage.contentWindow?.postMessage({ type: 'ttk-theme', style: current.style, tone: current.tone, font: current.font }, '*');
      } catch {}
    }

    function show(style, tone, font, device) {
      if (!styles.includes(style)) style = 'a';
      if (!tones.includes(tone)) tone = 'sinine';
      if (!fonts.includes(font)) font = 'source';
      if (device !== 'phone') device = 'desktop';
      current = { style, tone, font, device };
      const url = './v5-rahulik/index.html?v=' + REV + '&style=' + style + '&tone=' + tone + '&font=' + font;
      direct.href = url;
      wrap.dataset.device = device;
      styleTabs.forEach((tab) => {
        const on = tab.dataset.style === style;
        tab.setAttribute('aria-selected', String(on));
        tab.tabIndex = on ? 0 : -1;
      });
      toneBtns.forEach((btn) => btn.setAttribute('aria-pressed', String(btn.dataset.tone === tone)));
      fontBtns.forEach((btn) => btn.setAttribute('aria-pressed', String(btn.dataset.font === font)));
      deviceBtns.forEach((btn) => btn.setAttribute('aria-pressed', String(btn.dataset.device === device)));
      if (!stage.dataset.loaded) {
        stage.dataset.loaded = '1';
        stage.src = url;
      } else {
        pushTheme();
      }
      try {
        history.replaceState(null, '', '#' + style + '-' + tone + '-' + font + (device === 'phone' ? '/telefon' : ''));
      } catch {}
    }

    stage.addEventListener('load', pushTheme);

    styleTabs.forEach((tab, index) => {
      tab.addEventListener('click', () => show(tab.dataset.style, current.tone, current.font, current.device));
      tab.addEventListener('keydown', (event) => {
        const step = event.key === 'ArrowRight' ? 1 : event.key === 'ArrowLeft' ? -1 : 0;
        if (!step) return;
        event.preventDefault();
        const next = styleTabs[(index + step + styleTabs.length) % styleTabs.length];
        next.focus();
        show(next.dataset.style, current.tone, current.font, current.device);
      });
    });
    toneBtns.forEach((btn) => btn.addEventListener('click', () => show(current.style, btn.dataset.tone, current.font, current.device)));
    fontBtns.forEach((btn) => btn.addEventListener('click', () => show(current.style, current.tone, btn.dataset.font, current.device)));
    deviceBtns.forEach((btn) => btn.addEventListener('click', () => show(current.style, current.tone, current.font, btn.dataset.device)));

    const raw = location.hash.replace('#', '');
    const [triple = '', view = ''] = raw.split('/');
    const [st, tn, fn] = triple.split('-');
    show(styles.includes(st) ? st : 'a', tones.includes(tn) ? tn : 'sinine', fonts.includes(fn) ? fn : 'source', view === 'telefon' ? 'phone' : 'desktop');
  </script>
</body>
</html>
