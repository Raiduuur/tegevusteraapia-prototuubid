<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tegevusteraapia Keskus · kujundusvariandid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" />
  <script>
    (function () {
      var p = window.location.pathname;
      if (p && !p.endsWith('/') && !p.endsWith('.html')) {
        window.location.replace(p + '/' + window.location.search + window.location.hash);
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column;
      font: 500 13px/1.3 "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #E4DFD3; color: #EDEAE2;
      -webkit-font-smoothing: antialiased;
    }
    .bar { display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap; min-height: 48px; padding: 6px 16px; background: #1D2622; }
    .name { display: flex; align-items: baseline; gap: 8px; margin-right: auto; white-space: nowrap; }
    .name strong { font-weight: 600; font-size: 13.5px; letter-spacing: -0.01em; color: #FFFFFF; }
    .name span { color: #A9B5AF; font-weight: 400; }
    .group { display: inline-flex; gap: 2px; padding: 3px; border-radius: 11px; background: rgba(255, 255, 255, 0.08); flex-wrap: wrap; }
    .group button {
      appearance: none; border: 0; background: transparent; color: #C9D2CD;
      min-height: 32px; padding: 5px 12px; border-radius: 8px; font: inherit; cursor: pointer;
      transition: background-color 140ms ease, color 140ms ease;
    }
    .group button:hover { color: #FFFFFF; background: rgba(255, 255, 255, 0.08); }
    .group button[aria-selected="true"], .group button[aria-pressed="true"] { background: #F4F0E8; color: #1D2622; font-weight: 600; }
    .open-link { color: #EDEAE2; text-decoration: underline; text-decoration-color: rgba(237, 234, 226, 0.4); text-underline-offset: 3px; padding: 6px 2px; white-space: nowrap; }
    .open-link:hover { text-decoration-color: currentColor; }
    :focus-visible { outline: 2px solid #9FD0BB; outline-offset: 2px; }
    .stage { flex: 1; min-height: 0; display: flex; justify-content: center; }
    iframe { flex: 1; width: 100%; height: 100%; border: 0; background: #F4F0E8; }
    .stage[data-device="phone"] { padding: 20px 12px; overflow: auto; }
    .stage[data-device="phone"] iframe {
      flex: 0 0 auto; width: 390px; max-width: 100%; height: 844px; max-height: 100%;
      border: 1px solid rgba(29, 38, 34, 0.18); border-radius: 28px;
      box-shadow: 0 12px 32px rgba(29, 38, 34, 0.10);
    }
    @media (max-width: 720px) {
      .name, .devices { display: none; }
      .bar { flex-wrap: nowrap; padding-inline: 10px; }
      .group[role="tablist"] { flex: 1 1 auto; flex-wrap: nowrap; min-width: 0; overflow-x: auto; scrollbar-width: none; }
      .group[role="tablist"] button { flex: 0 0 auto; }
      .stage[data-device="phone"] { padding: 0; }
      .stage[data-device="phone"] iframe { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <p class="name"><strong>Tegevusteraapia Keskus</strong><span>kujundusvariandid</span></p>
    <div class="group" role="tablist" aria-label="Kujundusvariant">
      <button type="button" role="tab" data-slug="v5-rahulik" aria-selected="true">Rahulik · uus</button>
      <button type="button" role="tab" data-slug="v2-pohjala" aria-selected="false" tabindex="-1">Põhjala</button>
      <button type="button" role="tab" data-slug="v1-kasikiri" aria-selected="false" tabindex="-1">Käsikiri</button>
      <button type="button" role="tab" data-slug="v3-paevavalgus" aria-selected="false" tabindex="-1">Päevavalgus</button>
      <button type="button" role="tab" data-slug="v4-eesti-puhas" aria-selected="false" tabindex="-1">Eesti Puhas</button>
    </div>
    <div class="group devices" role="group" aria-label="Vaate laius">
      <button type="button" data-device="desktop" aria-pressed="true">Arvuti</button>
      <button type="button" data-device="phone" aria-pressed="false">Telefon</button>
    </div>
    <a id="direct" class="open-link" href="./v5-rahulik/index.html" target="_blank" rel="noopener">Ava eraldi aknas</a>
  </header>
  <main class="stage" id="stage-wrap" data-device="desktop">
    <iframe id="stage" src="./v5-rahulik/index.html" title="Tegevusteraapia Keskuse prototüüp"></iframe>
  </main>
  <script>
    const slugs = ['v5-rahulik', 'v2-pohjala', 'v1-kasikiri', 'v3-paevavalgus', 'v4-eesti-puhas'];
    const stage = document.getElementById('stage');
    const wrap = document.getElementById('stage-wrap');
    const direct = document.getElementById('direct');
    const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
    const devices = Array.from(document.querySelectorAll('[data-device][aria-pressed]'));
    let current = { slug: 'v5-rahulik', device: 'desktop' };

    function show(slug, device) {
      if (!slugs.includes(slug)) slug = 'v5-rahulik';
      if (device !== 'phone') device = 'desktop';
      const url = './' + slug + '/index.html';
      if (slug !== current.slug || !stage.getAttribute('src').includes(slug)) stage.src = url;
      direct.href = url;
      wrap.dataset.device = device;
      tabs.forEach((tab) => {
        const on = tab.dataset.slug === slug;
        tab.setAttribute('aria-selected', String(on));
        tab.tabIndex = on ? 0 : -1;
      });
      devices.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.device === device)));
      current = { slug, device };
      try { history.replaceState(null, '', '#' + slug + (device === 'phone' ? '/telefon' : '')); } catch {}
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => show(tab.dataset.slug, current.device));
      tab.addEventListener('keydown', (event) => {
        const step = event.key === 'ArrowRight' ? 1 : event.key === 'ArrowLeft' ? -1 : 0;
        if (!step) return;
        event.preventDefault();
        const next = tabs[(index + step + tabs.length) % tabs.length];
        next.focus();
        show(next.dataset.slug, current.device);
      });
    });
    devices.forEach((button) => button.addEventListener('click', () => show(current.slug, button.dataset.device)));

    const [slug, view] = location.hash.replace('#', '').split('/');
    show(slugs.includes(slug) ? slug : 'v5-rahulik', view === 'telefon' ? 'phone' : 'desktop');
  </script>
</body>
</html>
